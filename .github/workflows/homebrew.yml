name: Homebrew formula

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Only when the formula changes. It builds the release tarball it pins, never
# this checkout, so a change anywhere else in the tree cannot affect the result.
# macos.yml checks the program itself.
on:
  workflow_dispatch:
  push:
    branches: [ trunk ]
    paths: &shared_paths
      - 'HomebrewFormula/**'
      - '.github/workflows/homebrew.yml'

  pull_request:
    branches: [ trunk ]
    paths: *shared_paths

jobs:
  formula:
    name: audit and install
    runs-on: macos-latest
    env:
      # Otherwise every brew command below updates Homebrew itself first.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Silences "style is a developer command".
      HOMEBREW_DEVELOPER: 1
    steps:
    - uses: actions/checkout@v7

    # The runner image's Homebrew lags the formula API it downloads, and an
    # older brew can fail to parse a newer dependency's JSON (seen on
    # immortal-barons).
    - name: Update Homebrew
      run: brew update

    # Homebrew refuses a formula that is not in a tap: install by path and by
    # URL are both rejected, and audit by path is disabled. Dropping the file
    # into Library/Taps is enough to make it "local/test/dealers-choice" -- no
    # brew tap-new needed. HomebrewFormula/ mirrors the layout in this repo,
    # which is itself a tap, so this checks the discovery rule we rely on.
    # Homebrew also refuses to load a formula from a tap that is not trusted.
    - name: Put the formula in a tap
      run: |
        TAP="$(brew --repository)/Library/Taps/local/homebrew-test"
        mkdir -p "$TAP/HomebrewFormula"
        cp HomebrewFormula/dealers-choice.rb "$TAP/HomebrewFormula/"
        echo "TAP=$TAP" >> "$GITHUB_ENV"
        brew trust local/test
        brew info local/test/dealers-choice

    # Homebrew's formula rules are keyed to a directory named exactly Formula,
    # so under HomebrewFormula/ the generic Ruby cops apply. The formula is
    # written to satisfy both sets.
    - name: Style
      run: brew style "$TAP/HomebrewFormula/dealers-choice.rb"

    - name: Audit
      run: brew audit --strict local/test/dealers-choice

    # Builds the release tarball the formula pins, which is what a user would
    # get.
    - name: Install from source
      run: brew install --build-from-source local/test/dealers-choice

    - name: Test
      run: brew test local/test/dealers-choice
