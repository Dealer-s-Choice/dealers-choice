# Answer LAN discovery probes so players on your local network find this server
# in their list. Set to no for an internet-only server. The
# --disable-lan-discovery flag (or DC_DISABLE_LAN_DISCOVERY) overrides this off.
lan_discovery = yes

# To publish this server to a registry so internet players can find it, create
# common.conf in the data directory and set the registry list there (the file is
# shared with the client; see docs/REGISTRY.md). With no registry configured the
# server publishes nowhere, which is the default.
